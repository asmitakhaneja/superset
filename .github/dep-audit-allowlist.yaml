#
# Dependency-audit allowlist for the `dep-audit` CI workflow.
#
# Each entry suppresses a single advisory reported by `pip-audit` or
# `npm audit`. An advisory may only be suppressed if it fits one of the
# eligibility rows documented in SECURITY.md ("Dependency-audit allowlist"):
#
#   dev-tooling            build/test/CI tooling not shipped in the runtime image
#   operator-boundary      operator-selected connector/component (deployment decision)
#   transitive-dependency  transitive dep Superset does not ship directly
#   tracked-upgrade        in-scope direct dep, accepted until `review-by` while
#                          the upgrade is batched (time-boxed risk acceptance)
#
# Required fields per entry: id, package, reason, security-md-scope-row,
# owner, review-by (ISO YYYY-MM-DD; a stale date fails CI). `ecosystem`
# (pip|npm) is optional but recommended so an id only matches its own tool.
#
# Removing an entry re-surfaces the advisory as a CI failure. Adding one is a
# normal, reviewable PR change. The schema is enforced by
# scripts/dependency_audit.py and tests/security/test_dep_audit_allowlist.py.

version: 1
entries:
  # --- npm (frontend) ---------------------------------------------------------
  - id: GHSA-55h3-fm53-wq99
    package: eslint-plugin-i18n-strings
    ecosystem: npm
    reason: >-
      Flagged "malware" advisory against a dev-only ESLint plugin; tracked as a
      package rename/false-positive. Lint tooling is never shipped to users.
    security-md-scope-row: dev-tooling
    owner: "@apache/superset-committers"
    review-by: 2027-04-30
  - id: GHSA-23hp-3jrh-7fpw
    package: tar
    ecosystem: npm
    reason: >-
      node-tar decompression DoS reachable only via the lerna monorepo tooling;
      build/dev-time only, not part of any shipped bundle.
    security-md-scope-row: dev-tooling
    owner: "@apache/superset-committers"
    review-by: 2027-04-30
